<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendy — Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">Spendy</h1>
      <p class="app-subtitle">Track your spending, take control.</p>
    </header>

    <section class="card form-card" aria-label="Add a new expense">
      <h2 class="card-title">New Expense</h2>
      <form id="expense-form" class="expense-form" autocomplete="off">
        <div class="form-row">
          <div class="form-group">
            <label for="expense-name" class="form-label">Name</label>
            <input
              type="text"
              id="expense-name"
              class="form-input"
              placeholder="e.g. Coffee"
              required
              autofocus
            />
          </div>
          <div class="form-group">
            <label for="expense-amount" class="form-label">Amount (CAD)</label>
            <input
              type="number"
              id="expense-amount"
              class="form-input"
              placeholder="0.00"
              min="0.01"
              step="0.01"
              required
            />
          </div>
          <div class="form-group form-group-btn">
            <label class="form-label">&nbsp;</label>
            <button type="submit" class="btn btn-primary" id="add-btn">Add</button>
          </div>
        </div>
      </form>
    </section>

    <section class="card summary-card" aria-label="Expense summary">
      <div class="summary-row">
        <span class="summary-label">Total Expenses</span>
        <span class="summary-amount" id="total-amount">$0.00</span>
      </div>
    </section>

    <section class="card list-card" aria-label="Expense list">
      <div class="list-header">
        <h2 class="card-title">History</h2>
        <span class="expense-count" id="expense-count">0 items</span>
      </div>
      <ul class="expense-list" id="expense-list">
        <li class="empty-state" id="empty-state">
          <span class="empty-icon">+</span>
          <p>No expenses yet. Add one above.</p>
        </li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
